# Place these locations inside the HTTPS server block for
# cs184.eecs.berkeley.edu. The application expects to receive the /repo prefix.

location = /repo {
    return 308 /repo/;
}

location ^~ /repo/ {
    include /etc/nginx/app_proxy_params;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    proxy_pass http://unix:/srv/appsockets/cs184/repo184/app.sock;
}

